<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Rentals"/>
  <meta name="theme-color" content="#F5F2ED"/>
  <title>Rentals — Login</title>
  <link rel="stylesheet" href="casa-castel.css"/>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--cc-bg); font-family: inherit;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
               env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    }
    .login-card {
      width: 100%; max-width: 340px;
      background: var(--cc-white); border: var(--cc-border);
      border-radius: var(--cc-r-lg); padding: 36px 28px 28px;
      margin: 24px;
    }
    .login-wordmark {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px; font-weight: 400; color: var(--cc-ink);
      margin-bottom: 4px; line-height: 1;
    }
    .login-sub {
      font-size: 11px; font-weight: 400; letter-spacing: .09em;
      text-transform: uppercase; color: var(--cc-stone);
      margin-bottom: 32px;
    }
    .login-btn {
      width: 100%; height: 48px;
      background: var(--cc-ink); color: var(--cc-white);
      border: none; border-radius: var(--cc-r-pill);
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; letter-spacing: .03em;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s;
    }
    .login-btn:active { opacity: .8; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-wordmark">Casa Castel</div>
    <div class="login-sub">Rentals</div>
    <button class="login-btn" onclick="login()">Enter</button>
  </div>

  <script>
    // If already logged in, skip straight to app
    if (localStorage.getItem('rentals_role')) {
      location.replace('rentals-index.html');
    }

    function login() {
      localStorage.setItem('rentals_role', 'landlord');
      location.replace('rentals-index.html');
    }
  </script>
</body>
</html>
