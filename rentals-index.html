<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Rentals"/>
  <meta name="theme-color" content="#F5F2ED"/>
  <title>Rentals — Management</title>
  <link rel="stylesheet" href="casa-castel.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
</head>
<body class="is-landlord">

  <!-- ══ APP SHELL ══ -->
  <div class="app-shell visible" id="appShell">

    <div class="cc-header">
      <nav class="cc-nav">
        <a class="cc-nav__logo" href="#">Rentals</a>
        <div class="nav-profile" id="navProfile">
          <button class="cc-nav__icon" onclick="toggleProfileMenu()" aria-label="Menu">
            <i class="ti ti-user"></i>
          </button>
          <div class="nav-profile-menu" id="navProfileMenu">
            <button class="nav-profile-menu-item" id="rpProfileBtn">Profile</button>
            <button class="nav-profile-menu-item" id="logoutBtn">Log out</button>
          </div>
        </div>
      </nav>
      <div class="cc-tabs" id="appTabs">
        <button class="cc-tab active" data-tab="apartments">Apartments</button>
        <button class="cc-tab"        data-tab="parking">Parking</button>
        <button class="cc-tab"        data-tab="tenants">Tenants</button>
      </div>
    </div>

    <div class="cc-layout" id="appLayout">
      <div class="cc-main" id="appMain">
        <div class="tab-content" id="tab-apartments"></div>
        <div class="tab-content" id="tab-parking"  style="display:none;"></div>
        <div class="tab-content" id="tab-tenants"  style="display:none;"></div>
      </div>
    </div>

  </div>

  </div>

  <!-- ══ CONTRACT PDF PREVIEW (Mietvertrag / Kurzzeit) ══ -->
  <div id="aptContractPdfPreviewOverlay" style="display:none;position:fixed;inset:0;z-index:600;background:var(--cc-surface);flex-direction:column;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(14px,env(safe-area-inset-top,14px)) 12px 12px;background:var(--cc-white);border-bottom:0.5px solid var(--cc-rule);flex-shrink:0;">
      <button id="aptCPdfPreviewClose" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:0.5px solid var(--cc-rule);border-radius:50%;cursor:pointer;color:var(--cc-stone);font-size:16px;flex-shrink:0;font-family:inherit;-webkit-tap-highlight-color:transparent;">✕</button>
      <span id="aptCPdfPreviewTitle" style="flex:1;text-align:center;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--cc-taupe);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></span>
      <button id="aptCPdfSaveBtn" style="display:flex;align-items:center;gap:6px;height:40px;padding:0 16px;background:var(--cc-ink);color:var(--cc-white);border:none;border-radius:8px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;">
        <i class="ti ti-printer" style="font-size:14px;"></i> PDF
      </button>
    </div>
    <div id="aptCPdfPreviewBody" style="flex:1;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:24px 16px 40px;display:flex;flex-direction:column;align-items:center;background:var(--cc-surface);">
      <div id="aptCPdfPreviewDoc" style="display:flex;flex-direction:column;gap:12px;align-items:flex-start;"></div>
    </div>
  </div>

  <!-- ══ ÜBERGABE PDF PREVIEW ══ -->
  <div id="aptUebergPreviewOverlay" style="display:none;position:fixed;inset:0;z-index:600;background:var(--cc-surface);flex-direction:column;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(14px,env(safe-area-inset-top,14px)) 12px 12px;background:var(--cc-white);border-bottom:0.5px solid var(--cc-rule);flex-shrink:0;">
      <button id="aptUebergPreviewClose" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:0.5px solid var(--cc-rule);border-radius:50%;cursor:pointer;color:var(--cc-stone);font-size:16px;flex-shrink:0;font-family:inherit;-webkit-tap-highlight-color:transparent;">✕</button>
      <span style="flex:1;text-align:center;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--cc-taupe);">Übergabeprotokoll</span>
      <button id="aptUebergSaveBtn" style="display:flex;align-items:center;gap:6px;height:40px;padding:0 16px;background:var(--cc-ink);color:var(--cc-white);border:none;border-radius:8px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;">
        <i class="ti ti-printer" style="font-size:14px;"></i> PDF
      </button>
    </div>
    <div id="aptUebergPreviewBody" style="flex:1;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:24px 16px 40px;display:flex;flex-direction:column;align-items:center;background:var(--cc-surface);">
    </div>
  </div>

  <!-- ══ SCRIPTS ══ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- Shared constants & Supabase client (defines SB_URL, SB_KEY, sbL) -->
  <script src="constants.js"></script>
  <script src="supabase-client.js"></script>
  <script src="settings.js"></script>

  <!-- Nav helpers -->
  <script>
    function toggleProfileMenu() {
      document.getElementById('navProfileMenu')?.classList.toggle('open');
    }
    document.addEventListener('click', e => {
      const profile = document.getElementById('navProfile');
      if (profile && !profile.contains(e.target)) {
        document.getElementById('navProfileMenu')?.classList.remove('open');
      }
    });
    function initNav() {
      document.getElementById('logoutBtn')?.addEventListener('click', () => {
        localStorage.removeItem('rentals_role');
        location.reload();
      });
      document.getElementById('rpProfileBtn')?.addEventListener('click', () => {
        document.getElementById('navProfileMenu')?.classList.remove('open');
        openRentalsProfile();
      });
    }
  </script>

  <script src="rentals-tab-apartments.js"></script>
  <script src="rentals-tab-parking.js"></script>
  <!-- PDF libs loaded after app shell — don't block apartment cards rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="rentals-ueberg-pdf.js"></script>
  <script src="rentals-kurzzeit.js"></script>
  <script src="rentals-mietvertrag.js"></script>
  <script src="rentals-profile.js"></script>

  <script>
    function switchTab(tabName) {
      try { localStorage.setItem('rentals_last_tab', tabName); } catch(e) {}
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      const tabEl = document.getElementById('tab-' + tabName);
      if (tabEl) tabEl.style.display = 'block';
      document.querySelectorAll('.cc-tab[data-tab]').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tabName);
      });
      if (tabName === 'apartments') loadApartments?.();
      if (tabName === 'parking')    loadParking?.();
    }

    function initTabs() {
      document.querySelectorAll('.cc-tab[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
    }

    // Mark authed — no login required
    localStorage.setItem('rentals_role', 'landlord');

    initTabs();
    initNav();

    const saved     = (() => { try { return localStorage.getItem('rentals_last_tab'); } catch(e) { return null; } })();
    const available = new Set(['apartments','parking','tenants']);
    switchTab((saved && available.has(saved)) ? saved : 'apartments');
  </script>

</body>
</html>
