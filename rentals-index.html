  <!-- Nav helpers -->
  <script>
    function toggleProfileMenu() {
      document.getElementById('navProfileMenu')?.classList.toggle('open');
    }
    document.addEventListener('click', e => {
      const profile = document.getElementById('navProfile');
      if (profile && !profile.contains(e.target)) {
        document.getElementById('navProfileMenu')?.classList.remove('open');
      }
    });
    function initNav() {
      document.getElementById('logoutBtn')?.addEventListener('click', () => {
        if (typeof ccDraftClearAll === 'function') ccDraftClearAll();   // generator drafts
        localStorage.removeItem('rentals_role');
        localStorage.removeItem('cc_role');
        if (typeof sbL !== 'undefined' && sbL) sbL.auth.signOut().catch(() => {});
        location.replace('login.html?logout=1');
      });
      document.getElementById('rpProfileBtn')?.addEventListener('click', () => {
        document.getElementById('navProfileMenu')?.classList.remove('open');
        openRentalsProfile();
      });
    }
  </script>

  <script>
    /* ── TAB SWITCHING — instant, no repaint glitch ─────────────────
       The tab shows immediately with what is already on screen. Fresh data is
       fetched in the background (one request at a time per tab) and the list is
       only repainted if something actually changed and you are not editing
       there. Open cards and each tab's scroll position are kept. After start,
       the other tabs are preloaded so their first visit is instant too. */
    const _rtLoaders = {
      apartments: () => (typeof loadApartments === 'function' ? loadApartments() : null),
      parking:    () => (typeof loadParking    === 'function' ? loadParking()    : null),
      tenants:    () => (typeof loadRntTenants === 'function' ? loadRntTenants() : null),
    };
    const _rtInflight = {}, _rtScroll = {};
    let _rtCurrent = null;
    // "Busy" = something unsaved or an editor / add form is open in that tab
    function _rtBusy(tab) {
      const el = document.getElementById('tab-' + tab);
      return !!(el && el.querySelector('.cc-save[data-cc-save="dirty"], .apt-edit-active, .tn-nk-add-form, .tn-nkv-add-form, .apt-hg-add-form'));
    }
    function _rtLoad(tab) {
      if (!_rtLoaders[tab]) return Promise.resolve();
      if (_rtInflight[tab]) return _rtInflight[tab];
      const p = Promise.resolve().then(_rtLoaders[tab])
        .catch(e => console.warn('[rentals] load ' + tab + ':', e))
        .finally(() => { delete _rtInflight[tab]; });
      _rtInflight[tab] = p;
      return p;
    }

    function switchTab(tabName) {
      if (_rtCurrent) _rtScroll[_rtCurrent] = window.scrollY;
      try { localStorage.setItem('rentals_last_tab', tabName); } catch(e) {}
      // Close any open sheets / preview overlays so none flash or carry across tabs
      document.querySelectorAll('.rm-overlay.open, .rm-confirm-overlay.open')
        .forEach(o => o.classList.remove('open'));
      ['aptContractPdfPreviewOverlay','pkUebergPreviewOverlay','aptUebergPreviewOverlay']
        .forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      const tabEl = document.getElementById('tab-' + tabName);
      if (tabEl) tabEl.style.display = 'block';
      document.querySelectorAll('.cc-tab[data-tab]').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tabName);
      });
      _rtCurrent = tabName;
      window.scrollTo(0, _rtScroll[tabName] || 0);   // each tab keeps its own scroll position
      if (tabName === 'tenants') {                     // first visit while still loading: say so
        const l = document.getElementById('rntTenantsList');
        if (l && !l.querySelector('.tn-card')) l.innerHTML = '<p class="tn-empty">Loading tenants…</p>';
      }
      _rtLoad(tabName);
    }

    function initTabs() {
      document.querySelectorAll('.cc-tab[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
    }

    // Auth gate — login happens on login.html (Supabase email + password).
    // Sync flag check first (no flash), then verify the real session.
    // The session check is retried once before anything is cleared: after a
    // PDF hand-off iOS may relaunch/reload this page while the client is
    // still refreshing an expired token — a single empty result must not
    // wipe the flags and log the user out (mirrors initLandlordAuth).
    if (!localStorage.getItem('rentals_role') && localStorage.getItem('cc_role') !== 'landlord') {
      location.replace('login.html');
    } else if (typeof sbL !== 'undefined' && sbL) {
      try { localStorage.setItem('mgmt_last_app', 'rentals-index.html'); } catch (e) {}
      // A failed check (connection) throws → caught below: app stays open
      const rntHasSession = () => sbL.auth.getSession().then(({ data, error }) => { if (error) throw error; return !!data.session; });
      rntHasSession().then(ok => {
        if (ok) return;
        return new Promise(r => setTimeout(r, 1200))
          .then(rntHasSession)
          .then(ok2 => {
            if (!ok2) {
              localStorage.removeItem('rentals_role');
              localStorage.removeItem('cc_role');
              location.replace('login.html');
            }
          });
      }).catch(() => { /* offline / refresh failed — keep app open */ });
    }

    initTabs();
    initNav();

    const saved     = (() => { try { return localStorage.getItem('rentals_last_tab'); } catch(e) { return null; } })();
    const available = new Set(['apartments','parking','tenants']);
    const _rtFirst = (saved && available.has(saved)) ? saved : 'apartments';
    switchTab(_rtFirst);
    // Preload the other tabs in the background (one after another) → their first visit is instant
    (_rtInflight[_rtFirst] || Promise.resolve()).then(() =>
      ['apartments', 'parking', 'tenants'].filter(t => t !== _rtFirst)
        .reduce((p, t) => p.then(() => _rtLoad(t)), Promise.resolve()));
  </script>
