<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="LT Real Estate"/>
  <meta name="theme-color" content="#F5F2ED"/>

  <link rel="apple-touch-icon" href="mgmt-apple-touch-icon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="mgmt-favicon-32.png"/>

  <style>
    html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
    .scr input.pv-field, .scr textarea.pv-field { width:100%; font-family:inherit; outline:none; }
    .cc-tab--dot { position:relative; }
    .cc-tab--dot::after { content:''; position:absolute; top:10px; right:2px; width:6px; height:6px; border-radius:50%; background:var(--cc-gold); }
    .nav-profile-menu { display:none; position:absolute; top:calc(100% + 6px); right:0; z-index:20; min-width:190px; padding:4px; background:#FDFCFA; border:.5px solid #E0DAD0; border-radius:10px; box-shadow:0 6px 18px rgba(30,27,24,.14); }
    .nav-profile-menu.open { display:block; }
    .nav-profile-menu-item { display:block; width:100%; min-height:40px; padding:0 12px; background:none; border:none; text-align:left; font-size:13px; font-weight:500; color:#3A3530; font-family:inherit; cursor:pointer; }
  </style>
</head>
<body class="pva">

  <div class="scr" id="pvApp" style="display:none;">
    <div class="scr-top"></div>
    <div class="cc-header">
      <nav class="cc-nav">
        <span class="cc-nav__logo">Providers</span>
        <div class="nav-actions" style="position:relative;">
          <button class="cc-nav__icon" type="button" id="pvaPreviewBtn" aria-label="Preview provider view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 12v.01M3 21h18M5 21V5a2 2 0 0 1 2-2h7.5M17 13.5V21M14 7h7m-3-3 3 3-3 3"></path></svg></button>
          <button class="cc-nav__icon" type="button" onclick="document.getElementById('navProfileMenu').classList.toggle('open')" aria-label="Management menu" aria-haspopup="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path></svg></button>
          <div class="nav-profile-menu" id="navProfileMenu">
            <button class="nav-profile-menu-item" onclick="location.href='properties.html'">Properties</button>
            <button class="nav-profile-menu-item" onclick="location.href='rentals-index.html'">Rentals</button>
            <button class="nav-profile-menu-item" onclick="location.href='landlord.html'">Casa Castel</button>
            <button class="nav-profile-menu-item" onclick="location.href='controlling.html'">Controlling</button>
            <button class="nav-profile-menu-item" onclick="location.href='settlements.html'">Settlements</button>
            <div style="height:1px;background:var(--cc-rule);margin:4px 0;"></div>
            <button class="nav-profile-menu-item" id="logoutBtn">Log out</button>
          </div>
        </div>
      </nav>
      <div class="cc-tabs" id="pvaTabs"></div>
    </div>

    <div class="k-mob-rot" id="pvaStrip" style="display:none;"></div>

    <div class="k-mob-week" id="pvaCardWrap">
      <div id="pvaCard"></div>
      <div id="pvaReports"></div>
      <div class="pv-tools"><button class="pv-tool pv-tool-pill pv-tool-pill--ag" type="button" data-tool="agenda"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg><span>Agenda</span></button><button class="pv-tool pv-tool-pill pv-tool-pill--li" type="button" data-tool="list"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg><span>List</span></button><button class="pv-tool pv-tool-pill pv-tool-pill--pe" type="button" data-tool="people"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.4"></circle><path d="M3.5 20c.6-3.4 2.8-5 5.5-5s4.9 1.6 5.5 5"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M15.5 14.6c2.4.2 4.2 1.6 4.9 4.4"></path></svg><span>People</span></button><button class="pv-tool pv-tool-pill pv-tool-pill--hi" type="button" data-tool="history"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg><span>History</span></button></div>
    </div>

    <div class="k-mob-chat">
      <div class="k-mob-chat-hdr">
        <span class="k-mob-chat-lbl">Proof &amp; chat</span>
        <button class="cc-hdr-refresh" type="button" id="pvaRefresh" aria-label="Refresh"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11A8 8 0 1 0 18 16.5M20 5v6h-6"></path></svg></button>
      </div>
      <div class="k-mob-feed" id="pvaFeed" style="display:flex;flex-direction:column;justify-content:flex-end;"></div>
    </div>
    <div id="pvaCompose"></div>

  <!-- People modal -->
  <div class="pv-scrim pv-hidden" id="pvaPeopleScrim">
    <div class="cc-modal-sheet" style="max-height:92vh;display:flex;flex-direction:column;">
      <div class="cc-modal-hdr"><span class="cc-modal-title" id="pvaPeopleTitle">People</span><button class="cc-modal-close" type="button" data-close="pvaPeopleScrim" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
      <div class="cc-modal-body" id="pvaPeopleBody" style="overflow-y:auto;"></div>
    </div>
  </div>

  <!-- New job modal -->
  <div class="pv-scrim pv-hidden" id="pvaNewJobScrim">
    <div class="cc-modal-sheet">
      <div class="cc-modal-hdr"><span class="cc-modal-title">New job</span><button class="cc-modal-close" type="button" data-close="pvaNewJobScrim" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
      <div class="cc-modal-body" id="pvaNewJobBody" style="background:#FDFCFA;padding:16px;"></div>
    </div>
  </div>

  <!-- Preview (read-only provider view) -->
  <div class="pv-scrim pv-hidden" id="pvaPreviewScrim">
    <div class="cc-modal-sheet" style="max-height:92vh;display:flex;flex-direction:column;">
      <div class="cc-modal-hdr"><span class="cc-modal-title">Preview · provider view</span><button class="cc-modal-close" type="button" data-close="pvaPreviewScrim" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
      <div class="cc-modal-body" id="pvaPreviewBody" style="background:var(--cc-bg);overflow-y:auto;padding:0;"></div>
    </div>
  </div>

  <!-- Agenda modal (board M5) -->
  <div class="pv-scrim pv-hidden" id="pvaAgendaScrim">
    <div class="cc-modal-sheet" style="max-height:92vh;display:flex;flex-direction:column;">
      <div class="cc-modal-hdr"><span class="cc-modal-title" id="pvaAgendaTitle">Agenda</span><button class="cc-modal-close" type="button" data-close="pvaAgendaScrim" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
      <div class="cc-modal-body" id="pvaAgendaBody" style="overflow-y:auto;"></div>
    </div>
  </div>

  <!-- List (board M6) -->
  <div class="pv-scrim pv-hidden" id="pvaListScrim">
    <div class="cc-modal-sheet" style="max-height:92vh;display:flex;flex-direction:column;">
      <div class="cc-modal-hdr"><span class="cc-modal-title" id="pvaListTitle">List</span><button class="cc-modal-close" type="button" data-close="pvaListScrim" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
      <div class="cc-modal-body" id="pvaListBody" style="overflow-y:auto;"></div>
    </div>
  </div>

  <!-- Fix invoice (board M2b) -->
  <div class="pv-scrim pv-hidden" id="pvaFixScrim">
    <div class="cc-modal-sheet">
      <div class="cc-modal-hdr"><span class="cc-modal-title">Fix · <b>invoice</b></span><button class="cc-modal-close" type="button" data-close="pvaFixScrim" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
      <div class="cc-modal-body" id="pvaFixBody" style="background:#FDFCFA;padding:12px 16px 6px;"></div>
    </div>
  </div>

  <!-- Flag (board M4) -->
  <div class="pv-scrim pv-hidden" id="pvaFlagScrim">
    <div class="cc-modal-sheet" style="max-height:92vh;display:flex;flex-direction:column;">
      <div class="cc-modal-hdr"><span class="cc-modal-title" id="pvaFlagTitle">Flag</span><button class="cc-modal-close" type="button" data-close="pvaFlagScrim" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
      <div class="cc-modal-body" id="pvaFlagBody" style="background:#FDFCFA;padding:12px 16px 4px;overflow-y:auto;"></div>
    </div>
  </div>

  <!-- History (board M8) -->
  <div class="pv-scrim pv-hidden" id="pvaHistoryScrim">
    <div class="cc-modal-sheet" style="max-height:92vh;display:flex;flex-direction:column;">
      <div class="cc-modal-hdr"><span class="cc-modal-title" id="pvaHistoryTitle">History</span><button class="cc-modal-close" type="button" data-close="pvaHistoryScrim" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
      <div class="cc-modal-body" id="pvaHistoryBody" style="overflow-y:auto;"></div>
    </div>
  </div>

  <!-- Photo viewer (board M3b) -->
  <div id="pvaViewer" class="pv-hidden" style="position:absolute;inset:0;z-index:150;background:#1E1B18;display:flex;flex-direction:column;"></div>

  </div><!-- /.scr -->

  <div class="ct-toast" id="ctToast" role="status" aria-live="polite" style="position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:8px 16px;background:var(--cc-ink);color:var(--cc-white);border-radius:16px;font-size:12px;letter-spacing:.04em;opacity:0;transition:opacity .2s;pointer-events:none;z-index:900;max-width:90vw;text-align:center;"></div>

  <script src="pv-review.js?v=2026-10-14-F4"></script>

  <script src="pv-lists.js?v=2026-10-13-P6"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="pv-invoice.js?v=2026-10-14-F3"></script>
