<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="LT Real Estate"/>
  <meta name="theme-color" content="#F5F2ED"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Real Estate — Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="apple-touch-icon" href="mgmt-apple-touch-icon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="mgmt-favicon-32.png"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="constants.js"></script>

  <style>
    :root {
      --cream:   #F5F2ED;
      --warm:    #EDE8E0;
      --rule:    #E0DAD0;
      --stone:   #C8BFB0;
      --taupe:   #9A8E7E;
      --body:    #3A3530;
      --ink:     #1E1B18;
      --gold:    #B8956A;
      --gold-lt: #F0E8DA;
      --gold-dk: #9A7040;
      --error:   #C0574A;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--body);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    .root {
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(32px + var(--safe-top)) 24px calc(40px + var(--safe-bottom));
    }

    .wordmark {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: 40px;
      letter-spacing: 0.03em;
      color: var(--ink);
      text-align: center;
      line-height: 1;
      margin-bottom: 7px;
    }
    .studio-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--taupe);
      text-align: center;
      margin-bottom: 3px;
    }
    .access-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--taupe);
      text-align: center;
      margin-bottom: 32px;
    }

    .login-form {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
    }

    /* ── APP BUTTONS ──
       Properties on its own row, then Casa Castel + Rentals, Controlling + Settlements.
       Each tile: icon, name (readable, dark), one short line what it's for. */
    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }
    .role-tab {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      min-height: 104px;
      padding: 14px 14px 13px;
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 14px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: border-color .15s, background .15s, box-shadow .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .role-tab--wide {
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: center;
      min-height: 0;
      padding: 14px;
      gap: 12px;
    }
    .role-tab:hover  { border-color: var(--stone); }
    .role-tab:active { transform: scale(.98); }
    .role-tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .role-tab__ico {
      width: 36px; height: 36px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--warm);
      border-radius: 10px;
      transition: background .15s;
    }
    .role-tab__ico i { font-size: 19px; color: var(--taupe); transition: color .15s; }
    .role-tab__txt  { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .role-tab__name { font-size: 14px; font-weight: 500; color: var(--ink); letter-spacing: 0.01em; line-height: 1.2; }
    .role-tab__sub  { font-size: 11.5px; font-weight: 400; color: var(--taupe); line-height: 1.3; }
    .role-tab__check {
      position: absolute; top: 12px; right: 12px;
      font-size: 18px; color: var(--gold-dk);
      opacity: 0; transform: scale(.6);
      transition: opacity .15s, transform .15s;
    }
    .role-tab--wide .role-tab__check { top: 50%; margin-top: -9px; right: 14px; }

    /* Selected */
    .role-tab.active {
      background: var(--gold-lt);
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold) inset;
    }
    .role-tab.active .role-tab__ico   { background: var(--gold-dk); }
    .role-tab.active .role-tab__ico i { color: #fff; }
    .role-tab.active .role-tab__name  { color: #5E4526; }
    .role-tab.active .role-tab__sub   { color: var(--gold-dk); }
    .role-tab.active .role-tab__check { opacity: 1; transform: none; }

    /* ── INPUTS ── */
    .cc-input {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      color: var(--ink);
      outline: none;
      transition: border-color .15s;
      -webkit-appearance: none;
    }
    .cc-input + .cc-input { margin-top: 10px; }
    .cc-input::placeholder { color: var(--taupe); }
    .cc-input:focus { border-color: var(--gold); }
    .cc-input.error { border-color: var(--error); }

    .login-error {
      font-size: 11px;
      color: var(--error);
      display: none;
      margin-top: 6px;
      padding-left: 1px;
    }
    .login-error.visible { display: block; }

    /* ── SIGNED-IN STATE ── */
    .signed-in {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 12px;
    }
    .signed-in.visible { display: flex; }
    .signed-in__email {
      font-size: 14px;
      color: var(--body);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .signed-in__out {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--taupe);
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    .signed-in__out:hover { color: var(--gold-dk); }

    /* ── ENTER ── */
    .enter-btn {
      width: 100%;
      height: 50px;
      margin-top: 14px;
      background: #3D3027;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s, opacity .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .enter-btn:hover  { background: #2E241D; }
    .enter-btn:active { transform: scale(.99); }
    .enter-btn:disabled { opacity: .55; cursor: default; }

    @media (min-width: 600px) {
      .wordmark { font-size: 46px; }
      .login-form { max-width: 380px; }
    }
  </style>
</head>
<body>

<div class="root">

  <p class="wordmark">Real Estate</p>
  <p class="studio-label">Management</p>
  <p class="access-label">Private access</p>

  <div class="login-form">

    <div class="role-tabs" role="group" aria-label="Choose an app">
      <button class="role-tab role-tab--wide" data-dest="properties.html" aria-pressed="false">
        <span class="role-tab__ico"><i class="ti ti-building-estate" aria-hidden="true"></i></span>
        <span class="role-tab__txt"><span class="role-tab__name">Properties</span><span class="role-tab__sub">Portfolio &amp; loans</span></span>
        <i class="ti ti-circle-check role-tab__check" aria-hidden="true"></i>
      </button>
      <button class="role-tab active" data-dest="landlord.html" data-tab="rooms" aria-pressed="true">
        <span class="role-tab__ico"><i class="ti ti-home-heart" aria-hidden="true"></i></span>
        <span class="role-tab__txt"><span class="role-tab__name">Casa Castel</span><span class="role-tab__sub">House &amp; tenants</span></span>
        <i class="ti ti-circle-check role-tab__check" aria-hidden="true"></i>
      </button>
      <button class="role-tab" data-dest="rentals-index.html" aria-pressed="false">
        <span class="role-tab__ico"><i class="ti ti-key" aria-hidden="true"></i></span>
        <span class="role-tab__txt"><span class="role-tab__name">Rentals</span><span class="role-tab__sub">Apartments &amp; parking</span></span>
        <i class="ti ti-circle-check role-tab__check" aria-hidden="true"></i>
      </button>
      <button class="role-tab" data-dest="controlling.html" aria-pressed="false">
        <span class="role-tab__ico"><i class="ti ti-chart-bar" aria-hidden="true"></i></span>
        <span class="role-tab__txt"><span class="role-tab__name">Controlling</span><span class="role-tab__sub">Income &amp; expenses</span></span>
        <i class="ti ti-circle-check role-tab__check" aria-hidden="true"></i>
      </button>
      <button class="role-tab" data-dest="settlements.html" aria-pressed="false">
        <span class="role-tab__ico"><i class="ti ti-receipt" aria-hidden="true"></i></span>
        <span class="role-tab__txt"><span class="role-tab__name">Settlements</span><span class="role-tab__sub">NK &amp; Hausgeld</span></span>
        <i class="ti ti-circle-check role-tab__check" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Shown when a Supabase session already exists -->
    <div class="signed-in" id="signedInBox">
      <span class="signed-in__email" id="signedInEmail"></span>
      <button class="signed-in__out" id="signOutBtn" type="button">Sign out</button>
    </div>

    <!-- Shown when no session exists -->
    <div id="credBox">
      <input class="cc-input" id="loginEmail" type="email" placeholder="Email"
             autocomplete="email" autocapitalize="none" spellcheck="false" inputmode="email"/>
      <input class="cc-input" id="loginPass" type="password" placeholder="Password"
             autocomplete="current-password"/>
    </div>

    <div class="login-error" id="loginError">Incorrect email or password.</div>

    <button class="enter-btn" id="enterBtn">Enter</button>

  </div>

</div>

<script>
  'use strict';

  /* ── SUPABASE ──
     Same project + key as all four apps (from constants.js).
     persistSession is on by default → the session lands in
     localStorage and is picked up by properties.html, landlord.html,
     rentals-index.html and controlling.html without a second login. */
  const _supa = supabase.createClient(SB_URL, SB_KEY, {
    auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
  });

  const loginEmail  = document.getElementById('loginEmail');
  const loginPass   = document.getElementById('loginPass');
  const loginError  = document.getElementById('loginError');
  const enterBtn    = document.getElementById('enterBtn');
  const credBox     = document.getElementById('credBox');
  const signedInBox = document.getElementById('signedInBox');
  const signedInEl  = document.getElementById('signedInEmail');
  const tabs        = document.querySelectorAll('.role-tab');

  /* The app you were last in (each app stores it when it opens). You are
     always sent back there — and that app reopens its own last tab. */
  const MGMT_APPS = ['landlord.html', 'rentals-index.html', 'controlling.html', 'properties.html', 'settlements.html'];
  const lastApp   = (() => { try { return localStorage.getItem('mgmt_last_app'); } catch (e) { return null; } })();
  let selectedDest = MGMT_APPS.includes(lastApp) ? lastApp : 'landlord.html';
  let selectedTab  = null;     // null = the app opens its own last tab
  let tileChosen   = false;    // true only when you tap an app tile yourself
  let hasSession   = false;

  const markTabs = () => tabs.forEach(t => { const on = t.dataset.dest === selectedDest; t.classList.toggle('active', on); t.setAttribute('aria-pressed', on); });
  markTabs();
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      selectedDest = tab.dataset.dest;
      markTabs();
      selectedTab  = tab.dataset.tab || null;
      tileChosen   = true;
      clearError();
    });
  });

  function clearError() {
    loginError.classList.remove('visible');
    loginEmail.classList.remove('error');
    loginPass.classList.remove('error');
  }

  function showError(msg) {
    loginError.textContent = msg || 'Incorrect email or password.';
    loginError.classList.add('visible');
    loginEmail.classList.add('error');
    loginPass.classList.add('error');
  }

  /* Legacy gate flags — kept as fast synchronous glue for the
     existing page gates. Single source of truth is the Supabase
     session; these are set on login and cleared on logout. */
  function setGateFlags() {
    localStorage.setItem('cc_role', 'landlord');
    localStorage.setItem('rentals_role', 'landlord');
  }
  function clearGateFlags() {
    localStorage.removeItem('cc_role');
    localStorage.removeItem('rentals_role');
  }

  function go() {
    setGateFlags();
    if (tileChosen && selectedTab) sessionStorage.setItem('cc_open_tab', selectedTab);
    window.location.replace(selectedDest);
  }

  async function attempt() {
    clearError();

    if (hasSession) { go(); return; }

    const email = loginEmail.value.trim();
    const pass  = loginPass.value;
    if (!email || !pass) { showError('Enter email and password.'); return; }

    enterBtn.disabled = true;
    enterBtn.textContent = '...';
    try {
      const { error } = await _supa.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      go();
    } catch (e) {
      showError();
      loginPass.value = '';
      loginPass.focus();
    } finally {
      enterBtn.disabled = false;
      enterBtn.textContent = 'Enter';
    }
  }

  async function signOutHere() {
    try { await _supa.auth.signOut(); } catch (e) {}
    clearGateFlags();
    hasSession = false;
    signedInBox.classList.remove('visible');
    credBox.style.display = '';
    setTimeout(() => loginEmail.focus(), 50);
  }

  /* ── BOOT ──
     Logged in  → straight back to the last app + its last tab (no "Enter").
     Logged out → login form. A short connection hiccup is NOT a logout:
     the check is retried, and a login stored on this device is kept. */
  const hasStoredLogin = () => {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        if (/^sb-.+-auth-token$/.test(localStorage.key(i) || '')) return true;
      }
    } catch (e) {}
    return false;
  };
  const checkSession = async () => {
    const { data, error } = await _supa.auth.getSession();
    if (error) throw error;
    return data.session;
  };
  const showForm = () => setTimeout(() => loginEmail.focus(), 100);
  (async () => {
    // Came here by tapping "Logout" → really log out, never forward.
    if (new URLSearchParams(location.search).has('logout')) {
      try { await _supa.auth.signOut(); } catch (e) {}
      clearGateFlags();
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      showForm();
      return;
    }
    // Safety net: forwarded a moment ago and landed here again → stop, don't loop.
    let justForwarded = false;
    try { justForwarded = Date.now() - (+sessionStorage.getItem('mgmt_fwd_ts') || 0) < 15000; } catch (e) {}

    let session = null, failed = false;
    try { session = await checkSession(); }
    catch (e) {
      failed = true;
      await new Promise(r => setTimeout(r, 1200));
      try { session = await checkSession(); failed = false; } catch (e2) { failed = true; }
    }

    const canForward = !!session || (failed && hasStoredLogin());
    if (canForward && !justForwarded) {
      try { sessionStorage.setItem('mgmt_fwd_ts', String(Date.now())); } catch (e) {}
      go();
      return;
    }
    if (session) {                               // loop guard hit: one-tap "Enter"
      hasSession = true;
      signedInEl.textContent = session.user?.email || 'Signed in';
      signedInBox.classList.add('visible');
      credBox.style.display = 'none';
      return;
    }
    if (!failed) clearGateFlags();                // really logged out
    showForm();
  })();

  enterBtn.addEventListener('click', attempt);
  document.getElementById('signOutBtn').addEventListener('click', signOutHere);
  loginEmail.addEventListener('keydown', e => { if (e.key === 'Enter') loginPass.focus(); });
  loginPass.addEventListener('keydown',  e => { if (e.key === 'Enter') attempt(); });
  loginEmail.addEventListener('input', clearError);
  loginPass.addEventListener('input', clearError);
</script>

</body>
</html>
